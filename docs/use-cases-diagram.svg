<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%" style="background:#0b0f19; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- TOP CONTAINER: SYSTEM ACTORS -->
  <rect x="50" y="20" width="900" height="100" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <text x="500" y="45" text-anchor="middle" fill="#9ca3af" font-size="14" font-weight="600" letter-spacing="0.5">System Actors</text>

  <!-- ACTOR PILLS -->
  <!-- Actor 1: Requester -->
  <rect x="90" y="60" width="170" height="44" rx="22" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <circle cx="114" cy="82" r="10" fill="#3b82f6"/>
  <text x="114" y="86" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="bold">REQ</text>
  <text x="190" y="87" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="600">Requester</text>

  <!-- Actor 2: Technician -->
  <rect x="310" y="60" width="170" height="44" rx="22" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <circle cx="334" cy="82" r="10" fill="#3b82f6"/>
  <text x="334" y="86" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="bold">TECH</text>
  <text x="410" y="87" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="600">Technician</text>

  <!-- Actor 3: Operations Lead -->
  <rect x="530" y="60" width="170" height="44" rx="22" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <circle cx="554" cy="82" r="10" fill="#3b82f6"/>
  <text x="554" y="86" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="bold">LEAD</text>
  <text x="630" y="87" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="600">Operations Lead</text>

  <!-- Actor 4: Administrator -->
  <rect x="750" y="60" width="170" height="44" rx="22" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <circle cx="774" cy="82" r="10" fill="#3b82f6"/>
  <text x="774" y="86" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="bold">ADM</text>
  <text x="850" y="87" text-anchor="middle" fill="#f8fafc" font-size="13" font-weight="600">Administrator</text>

  <!-- CONNECTOR PATHS -->
  <path d="M 175 104 C 175 135, 175 135, 175 160" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
  <path d="M 395 104 C 395 135, 395 135, 395 160" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
  <path d="M 615 104 C 615 135, 615 135, 615 160" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
  <path d="M 835 104 C 835 135, 835 135, 835 160" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>

  <!-- BOTTOM CONTAINER: SYSTEM BOUNDARY -->
  <rect x="50" y="150" width="900" height="460" rx="14" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <text x="500" y="178" text-anchor="middle" fill="#e5e7eb" font-size="14" font-weight="700" letter-spacing="0.3">
    AI-Powered IT Service Desk — System Boundary (Role-Based Use Case Allocation)
  </text>

  <!-- COLUMN 1: REQUESTER -->
  <g filter="url(#cardShadow)">
    <rect x="75" y="195" width="200" height="390" rx="10" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="75" y="195" width="200" height="45" rx="10" fill="#1e3a8a"/>
    <text x="175" y="223" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Requester</text>
    
    <g fill="#ffffff" font-size="11.5" font-weight="500">
      <text x="92" y="265">• <tspan font-weight="700">UC01</tspan> Login &amp; SSO Auth</text>
      <text x="92" y="295">• <tspan font-weight="700">UC02</tspan> Logout</text>
      <text x="92" y="325">• <tspan font-weight="700">UC03</tspan> View Service Telemetry</text>
      <text x="92" y="355">• <tspan font-weight="700">UC04</tspan> Submit Ticket &amp; Logs</text>
      <text x="92" y="385">• <tspan font-weight="700">UC05</tspan> Track Ticket Progress</text>
      <text x="92" y="415">• <tspan font-weight="700">UC06</tspan> Search KB Solutions</text>
      <text x="92" y="445">• <tspan font-weight="700">UC07</tspan> Rate &amp; Report KB Article</text>
      <text x="92" y="475">• <tspan font-weight="700">UC08</tspan> Answer AI Clarification</text>
      <text x="92" y="505">• <tspan font-weight="700">UC09</tspan> Confirm Resolution</text>
    </g>
  </g>

  <!-- COLUMN 2: TECHNICIAN -->
  <g filter="url(#cardShadow)">
    <rect x="295" y="195" width="200" height="390" rx="10" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="295" y="195" width="200" height="45" rx="10" fill="#1e3a8a"/>
    <text x="395" y="223" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Technician</text>
    
    <g fill="#ffffff" font-size="11.5" font-weight="500">
      <text x="312" y="265">• <tspan font-weight="700">UC01</tspan> Login &amp; SSO Auth</text>
      <text x="312" y="295">• <tspan font-weight="700">UC02</tspan> Logout</text>
      <text x="312" y="325">• <tspan font-weight="700">UC03</tspan> View Queue Telemetry</text>
      <text x="312" y="355">• <tspan font-weight="700">UC06</tspan> Search KB Solutions</text>
      <text x="312" y="385">• <tspan font-weight="700">UC08</tspan> Claim &amp; Triage Ticket</text>
      <text x="312" y="415">• <tspan font-weight="700">UC09</tspan> Update Fix &amp; Root Cause</text>
      <text x="312" y="445">• <tspan font-weight="700">UC10</tspan> AI Synthesize KB Draft</text>
      <text x="312" y="475">• <tspan font-weight="700">UC11</tspan> Author &amp; Edit KB</text>
      <text x="312" y="505">• <tspan font-weight="700">UC12</tspan> Escalate to Tier 2/3</text>
    </g>
  </g>

  <!-- COLUMN 3: OPERATIONS LEAD -->
  <g filter="url(#cardShadow)">
    <rect x="515" y="195" width="200" height="390" rx="10" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="515" y="195" width="200" height="45" rx="10" fill="#1e3a8a"/>
    <text x="615" y="223" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Operations Lead</text>
    
    <g fill="#ffffff" font-size="11.5" font-weight="500">
      <text x="532" y="265">• <tspan font-weight="700">UC01</tspan> Login &amp; SSO Auth</text>
      <text x="532" y="295">• <tspan font-weight="700">UC02</tspan> Logout</text>
      <text x="532" y="325">• <tspan font-weight="700">UC03</tspan> View Team Telemetry</text>
      <text x="532" y="355">• <tspan font-weight="700">UC08</tspan> Dispatch Team Queue</text>
      <text x="532" y="385">• <tspan font-weight="700">UC09</tspan> Update Fix &amp; Root Cause</text>
      <text x="532" y="415">• <tspan font-weight="700">UC10</tspan> AI Synthesize KB Draft</text>
      <text x="532" y="445">• <tspan font-weight="700">UC11</tspan> Author &amp; Edit KB</text>
      <text x="532" y="475">• <tspan font-weight="700">UC13</tspan> Review &amp; Publish (Diff)</text>
      <text x="532" y="505">• <tspan font-weight="700">UC14</tspan> Dry-run SLA Policies</text>
    </g>
  </g>

  <!-- COLUMN 4: ADMINISTRATOR -->
  <g filter="url(#cardShadow)">
    <rect x="735" y="195" width="200" height="390" rx="10" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="735" y="195" width="200" height="45" rx="10" fill="#1e3a8a"/>
    <text x="835" y="223" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Administrator</text>
    
    <g fill="#ffffff" font-size="11.5" font-weight="500">
      <text x="752" y="265">• <tspan font-weight="700">UC01</tspan> Login &amp; SSO Auth</text>
      <text x="752" y="295">• <tspan font-weight="700">UC02</tspan> Logout</text>
      <text x="752" y="325">• <tspan font-weight="700">UC03</tspan> Executive Dashboard</text>
      <text x="752" y="355">• <tspan font-weight="700">UC11</tspan> Author &amp; Edit KB</text>
      <text x="752" y="385">• <tspan font-weight="700">UC13</tspan> Review &amp; Publish (Diff)</text>
      <text x="752" y="415">• <tspan font-weight="700">UC14</tspan> Configure Rules &amp; SLA</text>
      <text x="752" y="445">• <tspan font-weight="700">UC15</tspan> AI Scope &amp; Whitelist</text>
      <text x="752" y="475">• <tspan font-weight="700">UC16</tspan> Security Audit Trail</text>
      <text x="752" y="505">• <tspan font-weight="700">UC17</tspan> Manage Users &amp; RBAC</text>
    </g>
  </g>
</svg>